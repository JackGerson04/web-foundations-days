<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Client–Server Users</title>
  <script src="users.js" defer></script>
</head>
<body>
  <main>
    <h1>Users Directory</h1>
    <p>Load users from a remote API, then filter the results by name.</p>

    <button id="load-users" type="button">Load users</button>

    <p>
      <label for="filter-input">Filter users by name:</label>
      <input id="filter-input" type="search" placeholder="Enter a name">
    </p>

    <p id="status" role="status" aria-live="polite">Select “Load users” to fetch the user list.</p>
    <ul id="users-list"></ul>
  </main>
</body>
</html>
